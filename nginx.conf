# Servidor estático: puerto 8080 (sin privilegios), escucha en 0.0.0.0/[::].
server {
    listen       8080 default_server;
    listen       [::]:8080 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset       utf-8;
    server_tokens off;

    # Redirecciones relativas: el sitio funciona igual en un subdominio
    # (zzever.orkestr.run) o servido bajo un directorio / detrás de un proxy.
    absolute_redirect off;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Directorios con URL limpia:
    #   /seccion/  -> /seccion/index.html
    #   /seccion   -> /seccion/index.html  o  /seccion.html
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # Recursos estáticos con caché larga; el HTML se sirve siempre fresco.
    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
